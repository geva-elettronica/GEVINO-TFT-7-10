name=GEVINO TFT
version=1.1.0
author=Giorgio - GEVA Elettronica
maintainer=GEVA Elettronica <info@gevaelettronica.it>
sentence=Support library for the GEVINO TFT 7"/10" HMI PLC (SAMD21, Arduino Zero compatible, Raio RA8876 display).
paragraph=Library for the GEVINO TFT HMI PLC: board I/O macros (12 opto-isolated inputs, 8 opto-isolated outputs via 74HC595/74HC165 shift registers), the Raio RA8876 1024x600 display driver, 7"/10" capacitive-touch support (FT5206/GT9271), front USB-stick reader (CH376), the extra SERCOM UARTs, RS485 transmit-enable, non-blocking ADC polling with bundled SAMD21 ADC helpers, and a non-blocking Timer class. The 7" and 10" models share one board (only the glass changes).
category=Display
url=https://github.com/gioreva/GEVINO-TFT-7-10
architectures=samd
includes=gevino_tft_io.h
